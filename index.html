<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulator Parts Request</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%231a73e8%22><path d=%22M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z%22/></svg>">
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --border: #dadce0;
      --bg: #f8f9fa;
      --text: #202124;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 24px 12px; }
    .container { max-width: 860px; margin: 0 auto; background: white; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(60,64,67, 0.15); }
    header { background: #1e293b; color: white; padding: 20px 24px; }
    header h1 { margin: 0; font-size: 1.3rem; font-weight: 600; }
    header p { margin: 4px 0 0; font-size: 0.88rem; color: #94a3b8; }
    form { padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .field { display: flex; flex-direction: column; }
    label { font-weight: 600; font-size: 0.82rem; margin-bottom: 5px; color: #3c4043; }
    .req { color: #d93025; }
    input, select { padding: 9px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.9rem; height: 38px; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    .section-head { font-weight: 600; font-size: 0.95rem; color: #1e293b; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin: 24px 0 12px; }
    .part-row {
      display: grid;
      grid-template-columns: 2fr 3fr 2fr 90px 42px;
      gap: 10px;
      align-items: flex-end;
      background: #f8fafc;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      margin-bottom: 10px;
    }
    @media (max-width: 700px) {
      .part-row { grid-template-columns: 1fr 1fr; }
      .desc-col { grid-column: span 2; }
      .del-col { grid-column: span 2; display: flex; justify-content: flex-end; }
    }
    .del-col { display: flex; align-items: flex-end; justify-content: center; }
    .btn { cursor: pointer; font-weight: 600; border-radius: 4px; border: none; font-size: 0.9rem; }
    .btn-submit { background: var(--primary); color: white; padding: 11px 22px; }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-add { background: #f1f3f4; color: #3c4043; border: 1px solid var(--border); padding: 9px 14px; margin-top: 4px; }
    .btn-add:hover { background: #e8eaed; }
    .btn-del { 
      background: #ffffff; 
      color: #64748b; 
      height: 38px; 
      width: 38px; 
      border-radius: 4px; 
      border: 1px solid var(--border); 
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all 0.15s ease-in-out;
    }
    .btn-del:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
    .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    
    /* Success Banner Styling */
    .success-msg { 
      display: none; 
      background: #ecfdf5; 
      border: 1px solid #6ee7b7; 
      color: #065f46; 
      padding: 16px 20px; 
      border-radius: 6px; 
      margin-top: 18px; 
      animation: fadeIn 0.2s ease-in-out;
    }
    .success-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }
    .btn-dismiss {
      background: #059669;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-dismiss:hover { background: #047857; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Simulator Parts Request</h1>
    <p>Request Simulator Parts Order</p>
  </header>

  <form id="partsForm">
    <!-- Header Details -->
    <div class="grid">
      <div class="field">
        <label for="center">Training Center <span class="req">*</span></label>
        <input type="text" id="center" placeholder="e.g. GKY, AUS, PHX" required>
      </div>

      <div class="field">
        <label for="sim">Simulator Number <span class="req">*</span></label>
        <input type="text" id="sim" placeholder="e.g. F325, F45" required>
      </div>

      <div class="field">
        <label for="dr">DR Number <span class="req">*</span></label>
        <input type="text" id="dr" placeholder="e.g. DR-10492" required>
      </div>

      <div class="field">
        <label for="urgency">Urgency <span class="req">*</span></label>
        <select id="urgency" required>
          <option value="" disabled selected>Select timeframe...</option>
          <option value="ASAP">ASAP</option>
          <option value="As soon as practical">As soon as practical</option>
          <option value="No Rush">No Rush</option>
        </select>
      </div>
    </div>

    <!-- Requested Parts -->
    <div class="section-head">Requested Parts</div>
    <div id="partsContainer">
      <div class="part-row" id="row_1">
        <div class="field">
          <label>Part Number</label>
          <input type="text" name="pn" placeholder="If available">
        </div>
        <div class="field desc-col">
          <label>Part Description <span class="req">*</span></label>
          <input type="text" name="desc" placeholder="e.g. Rudder Load Cell" required>
        </div>
        <div class="field">
          <label>Manufacturer / OEM</label>
          <input type="text" name="oem" placeholder="If known">
        </div>
        <div class="field">
          <label>Qty <span class="req">*</span></label>
          <input type="number" name="qty" value="1" min="1" required>
        </div>
        <div class="del-col">
          <button type="button" class="btn btn-del" title="Remove part" onclick="removeRow(1)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <button type="button" id="addPartBtn" class="btn btn-add">+ Add Another Part</button>

    <!-- Dismissable 1-Minute Success Alert -->
    <div class="success-msg" id="successMsg">
      <div class="success-inner">
        <div>
          <b>✓ Request Dispatched:</b> Your order has been submitted to the Simulator Maintenance Coordinator. Please check SimTrack for updates.
        </div>
        <button type="button" class="btn-dismiss" onclick="dismissAndReset()">Dismiss &amp; Submit Another</button>
      </div>
    </div>

    <!-- Submission Action -->
    <div class="actions-bar">
      <span style="font-size: 0.8rem; color: #64748b;">No login required to submit</span>
      <button type="submit" id="submitBtn" class="btn btn-submit">Submit Request</button>
    </div>
  </form>
</div>

<script>
  const COORDINATOR_EMAIL = "anthony.guthrie@atpjets.com";
  let rowCounter = 1;
  let successTimer = null;

  function addPartRow() {
    rowCounter++;
    const container = document.getElementById("partsContainer");
    const div = document.createElement("div");
    div.className = "part-row";
    div.id = "row_" + rowCounter;
    div.innerHTML = `
      <div class="field">
        <label>Part Number</label>
        <input type="text" name="pn" placeholder="If available">
      </div>
      <div class="field desc-col">
        <label>Part Description <span class="req">*</span></label>
        <input type="text" name="desc" placeholder="e.g. Rudder Load Cell" required>
      </div>
      <div class="field">
        <label>Manufacturer / OEM</label>
        <input type="text" name="oem" placeholder="If known">
      </div>
      <div class="field">
        <label>Qty <span class="req">*</span></label>
        <input type="number" name="qty" value="1" min="1" required>
      </div>
      <div class="del-col">
        <button type="button" class="btn btn-del" title="Remove part" onclick="removeRow(${rowCounter})">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
    `;
    container.appendChild(div);
  }

  function removeRow(id) {
    const container = document.getElementById("partsContainer");
    if (container.getElementsByClassName("part-row").length <= 1) {
      alert("At least one part is required.");
      return;
    }
    const target = document.getElementById("row_" + id);
    if (target) target.remove();
  }

  document.getElementById("addPartBtn").addEventListener("click", addPartRow);

  // Clears the banner and restores a fresh, single-row form
  function dismissAndReset() {
    if (successTimer) clearTimeout(successTimer);
    document.getElementById("successMsg").style.display = "none";
    document.getElementById("partsForm").reset();

    // Reset parts container back to single clean row
    const container = document.getElementById("partsContainer");
    rowCounter = 1;
    container.innerHTML = `
      <div class="part-row" id="row_1">
        <div class="field">
          <label>Part Number</label>
          <input type="text" name="pn" placeholder="If available">
        </div>
        <div class="field desc-col">
          <label>Part Description <span class="req">*</span></label>
          <input type="text" name="desc" placeholder="e.g. Rudder Load Cell" required>
        </div>
        <div class="field">
          <label>Manufacturer / OEM</label>
          <input type="text" name="oem" placeholder="If known">
        </div>
        <div class="field">
          <label>Qty <span class="req">*</span></label>
          <input type="number" name="qty" value="1" min="1" required>
        </div>
        <div class="del-col">
          <button type="button" class="btn btn-del" title="Remove part" onclick="removeRow(1)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
      </div>
    `;

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Request";
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Background Form Submission
  document.getElementById("partsForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    const center = document.getElementById("center").value.trim();
    const sim = document.getElementById("sim").value.trim();
    const dr = document.getElementById("dr").value.trim();
    const urgency = document.getElementById("urgency").value;

    let partsText = "";
    document.querySelectorAll(".part-row").forEach((r, i) => {
      const pn = r.querySelector('[name="pn"]').value.trim() || "Not available / Unknown";
      const desc = r.querySelector('[name="desc"]').value.trim();
      const oem = r.querySelector('[name="oem"]').value.trim() || "N/A";
      const qty = r.querySelector('[name="qty"]').value.trim() || "1";
      partsText += `[${i + 1}] Desc: ${desc} | P/N: ${pn} | OEM: ${oem} | Qty: ${qty}\n`;
    });

    try {
      const response = await fetch(`https://formsubmit.co/ajax/${COORDINATOR_EMAIL}`, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          _subject: `[${urgency}] Parts Request: ${center} - ${sim} (DR: ${dr})`,
          "Training Center": center,
          "Simulator Number": sim,
          "DR Number": dr,
          "Urgency": urgency,
          "Parts List": partsText
        })
      });

      if (response.ok) {
        document.getElementById("successMsg").style.display = "block";
        submitBtn.textContent = "Request Sent!";

        // Stays for 1 minute (60,000 ms) unless dismissed earlier
        successTimer = setTimeout(() => {
          dismissAndReset();
        }, 60000);

      } else {
        throw new Error("Form submission failed");
      }
    } catch (err) {
      alert("Could not send in the background. Opening your default mail client as fallback...");
      window.location.href = `mailto:${COORDINATOR_EMAIL}?subject=${encodeURIComponent(`[${urgency}] Parts Request: ${center} - ${sim} (DR: ${dr})`)}&body=${encodeURIComponent(partsText)}`;
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Request";
    }
  });
</script>

</body>
</html>
