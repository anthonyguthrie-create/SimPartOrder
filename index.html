<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simulator Parts Request Order Form">
  <title>Simulator Parts Request</title>
  
  <!-- Inline SVG Favicon (prevents 404s on GitHub Pages) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%231a73e8%22><path d=%22M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z%22/></svg>">

  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --border: #dadce0;
      --bg: #f8f9fa;
      --text: #202124;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 24px 12px; }
    .container { max-width: 860px; margin: 0 auto; background: white; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(60,64,67, 0.15); }
    
    header { background: #1e293b; color: white; padding: 20px 24px; }
    header h1 { margin: 0; font-size: 1.3rem; font-weight: 600; letter-spacing: 0.3px; }
    header p { margin: 4px 0 0; font-size: 0.88rem; color: #94a3b8; }
    form { padding: 24px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .field { display: flex; flex-direction: column; }
    label { font-weight: 600; font-size: 0.82rem; margin-bottom: 5px; color: #3c4043; }
    .req { color: #d93025; }
    input, select { 
      padding: 9px 10px; 
      border: 1px solid var(--border); 
      border-radius: 4px; 
      font-size: 0.9rem; 
      height: 38px;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2); }

    /* Parts Section */
    .section-head { font-weight: 600; font-size: 0.95rem; color: #1e293b; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin: 24px 0 12px; }
    .part-row {
      display: grid;
      grid-template-columns: 2fr 3fr 2fr 90px 42px;
      gap: 10px;
      align-items: flex-end;
      background: #f8fafc;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      margin-bottom: 10px;
    }
    @media (max-width: 700px) {
      .part-row { grid-template-columns: 1fr 1fr; }
      .desc-col { grid-column: span 2; }
      .del-col { grid-column: span 2; display: flex; justify-content: flex-end; }
    }
    
    .del-col {
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .btn { cursor: pointer; font-weight: 600; border-radius: 4px; border: none; font-size: 0.9rem; }
    .btn-submit { background: var(--primary); color: white; display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-add { background: #f1f3f4; color: #3c4043; border: 1px solid var(--border); padding: 9px 14px; margin-top: 4px; }
    .btn-add:hover { background: #e8eaed; }
    
    .btn-del { 
      background: #ffffff; 
      color: #64748b; 
      height: 38px; 
      width: 38px; 
      border-radius: 4px; 
      border: 1px solid var(--border); 
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all 0.15s ease-in-out;
    }
    .btn-del:hover { 
      background: #fee2e2; 
      color: #dc2626; 
      border-color: #fca5a5;
    }

    .actions-bar { display: flex; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Simulator Parts Request</h1>
    <p>Request Simulator Parts Order</p>
  </header>

  <form id="partsForm">
    <!-- Header Details -->
    <div class="grid">
      <div class="field">
        <label for="center">Training Center <span class="req">*</span></label>
        <input type="text" id="center" placeholder="e.g. GKY, AUS, PHX" required>
      </div>

      <div class="field">
        <label for="sim">Simulator Number <span class="req">*</span></label>
        <input type="text" id="sim" placeholder="e.g. F325, F45" required>
      </div>

      <div class="field">
        <label for="dr">DR Number <span class="req">*</span></label>
        <input type="text" id="dr" placeholder="e.g. DR-10492" required>
      </div>

      <div class="field">
        <label for="urgency">Urgency <span class="req">*</span></label>
        <select id="urgency" required>
          <option value="" disabled selected>Select timeframe...</option>
          <option value="ASAP">ASAP</option>
          <option value="As soon as practical">As soon as practical</option>
          <option value="No Rush">No Rush</option>
        </select>
      </div>
    </div>

    <!-- Requested Parts -->
    <div class="section-head">Requested Parts</div>
    <div id="partsContainer">
      <!-- First Part Row -->
      <div class="part-row" id="row_1">
        <div class="field">
          <label>Part Number</label>
          <input type="text" name="pn" placeholder="If available">
        </div>
        <div class="field desc-col">
          <label>Part Description <span class="req">*</span></label>
          <input type="text" name="desc" placeholder="e.g. Rudder Load Cell" required>
        </div>
        <div class="field">
          <label>Manufacturer / OEM</label>
          <input type="text" name="oem" placeholder="If known">
        </div>
        <div class="field">
          <label>Qty <span class="req">*</span></label>
          <input type="number" name="qty" value="1" min="1" required>
        </div>
        <div class="del-col">
          <button type="button" class="btn btn-del" title="Remove part" onclick="removeRow(1)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <button type="button" id="addPartBtn" class="btn btn-add">+ Add Another Part</button>

    <!-- Submission Action -->
    <div class="actions-bar">
      <button type="submit" class="btn btn-submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        Open & Send in Gmail
      </button>
    </div>
  </form>
</div>

<script>
  const COORDINATOR_EMAIL = "anthony.guthrie@atpjets.com";
  let rowCounter = 1;

  function addPartRow() {
    rowCounter++;
    const container = document.getElementById("partsContainer");
    const div = document.createElement("div");
    div.className = "part-row";
    div.id = "row_" + rowCounter;
    div.innerHTML = `
      <div class="field">
        <label>Part Number</label>
        <input type="text" name="pn" placeholder="If available">
      </div>
      <div class="field desc-col">
        <label>Part Description <span class="req">*</span></label>
        <input type="text" name="desc" placeholder="e.g. Rudder Load Cell" required>
      </div>
      <div class="field">
        <label>Manufacturer / OEM</label>
        <input type="text" name="oem" placeholder="If known">
      </div>
      <div class="field">
        <label>Qty <span class="req">*</span></label>
        <input type="number" name="qty" value="1" min="1" required>
      </div>
      <div class="del-col">
        <button type="button" class="btn btn-del" title="Remove part" onclick="removeRow(${rowCounter})">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    `;
    container.appendChild(div);
  }

  function removeRow(id) {
    const container = document.getElementById("partsContainer");
    const rows = container.getElementsByClassName("part-row");
    if (rows.length <= 1) {
      alert("At least one part is required.");
      return;
    }
    const target = document.getElementById("row_" + id);
    if (target) {
      target.remove();
    }
  }

  document.getElementById("addPartBtn").addEventListener("click", addPartRow);

  document.getElementById("partsForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const center = document.getElementById("center").value.trim();
    const sim = document.getElementById("sim").value.trim();
    const dr = document.getElementById("dr").value.trim();
    const urgency = document.getElementById("urgency").value;

    const subject = `[${urgency}] Parts Request: ${center} - ${sim} (DR: ${dr})`;

    let body = `SIMULATOR PARTS REQUEST\n`;
    body += `====================================================\n`;
    body += `Training Center : ${center}\n`;
    body += `Simulator Number: ${sim}\n`;
    body += `DR Number       : ${dr}\n`;
    body += `Urgency         : ${urgency}\n`;
    body += `Submitted       : ${new Date().toLocaleString()}\n`;
    body += `====================================================\n\n`;
    body += `PARTS NEEDED:\n`;
    body += `----------------------------------------------------\n`;

    const rows = document.querySelectorAll(".part-row");
    rows.forEach((r, i) => {
      const pn = r.querySelector('[name="pn"]').value.trim() || "Not available / Unknown";
      const desc = r.querySelector('[name="desc"]').value.trim();
      const oem = r.querySelector('[name="oem"]').value.trim() || "N/A";
      const qty = r.querySelector('[name="qty"]').value.trim() || "1";

      body += `Item ${i + 1}:\n`;
      body += `  Description : ${desc}\n`;
      body += `  Part Number : ${pn}\n`;
      body += `  Mfg / OEM   : ${oem}\n`;
      body += `  Quantity    : ${qty}\n\n`;
    });

    body += `----------------------------------------------------\n`;

    const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(COORDINATOR_EMAIL)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    const win = window.open(gmailUrl, "_blank");
    if (!win || win.closed || typeof win.closed === "undefined") {
      window.location.href = `mailto:${COORDINATOR_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }
  });
</script>

</body>
</html>
